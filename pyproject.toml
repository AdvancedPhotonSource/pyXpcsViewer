[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "xpcs-viewer"                                                                              # Match the PyPI package name
dynamic = ["version"]
description = "pyXPCSViewer: A python-based interactive tool to visualize and model XPCS dataset"
readme = "README.rst"
authors = [{ name = "Miaoqi Chu", email = "mqichu@anl.gov" }]
maintainers = [{ name = "Miaoqi Chu", email = "mqichu@anl.gov" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

license = { text = "MIT" }
keywords = [
    "XPCS",
    "X-ray",
    "photon correlation spectroscopy",
    "synchrotron",
    "visualization",
    "science",
]

dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "pyqtgraph",
    "pandas",
    "scikit-learn",
    "joblib",
    "psutil",
    "tqdm",
    "hdf5plugin",
    "pyside6>=6.8.3,<7",
]

[project.scripts]
pyxpcsviewer = "pyxpcsviewer.cli:main"
run_viewer = "pyxpcsviewer.cli:main"

[project.optional-dependencies]
dev = ["coverage", "pytest", "pytest-cov", "mypy", "ruff"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
bugs = "https://github.com/AZjk/pyxpcsviewer/issues"
changelog = "https://github.com/AZjk/pyxpcsviewer/blob/master/changelog.md"
homepage = "https://github.com/AZjk/pyxpcsviewer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-timestamp"

[tool.setuptools.package-data]
"*" = ["*.*"]

# Ruff
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "src/pyxpcsviewer/gui/view/viewer_ui.py",
    "src/pyxpcsviewer/gui/view/icons_rc.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pyxpcsviewer"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # re-exported names

# Mypy
[tool.mypy]
files = "."
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
