name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  # The shared Python package of the beamline web stack, installed from its monorepo at a tag
  # until it is published on PyPI. Keep the tag in step with the version pinned in pyproject.toml.
  WEBKIT_SPEC: "beamline-webkit @ git+https://github.com/AdvancedPhotonSource/beamline-web.git@webkit-py-v0.2.0#subdirectory=packages/webkit-py"

jobs:
  test:
    name: pytest (gui and web extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs the tags

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1 libgl1 libopengl0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "$WEBKIT_SPEC"
          pip install -e ".[dev,gui,web]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -ra

  no-qt:
    name: pytest without the gui extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without Qt
        run: |
          python -m pip install --upgrade pip
          pip install "$WEBKIT_SPEC"
          pip install -e ".[dev,web]"

      - name: No Qt was pulled in
        run: |
          python - <<'PY'
          import importlib.util, sys
          qt = [m for m in ("PySide6", "shiboken6", "pyqtgraph") if importlib.util.find_spec(m)]
          sys.exit(f"Qt packages installed without the gui extra: {qt}" if qt else 0)
          PY
          pyxpcsviewer --version
          pyxpcsviewer-web --version

      - name: Test (the GUI tests skip)
        run: pytest -ra
