name: Build release binaries

on:
  push:
    tags:
      - '*'

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .[pyinstaller]

      - name: Generate .ico from app icon
        run: |
          python -c "from PIL import Image; im = Image.open('src/pyxpcsviewer/gui/view/resources/icons8-giraffe-full-body-100.png'); im.save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name pyxpcsviewer --icon icon.ico --collect-all PySide6 --collect-all hdf5plugin src/pyxpcsviewer/cli.py

      - name: Smoke test executable
        run: |
          dist\pyxpcsviewer.exe --version

      - name: Rename artifact
        run: |
          Rename-Item dist\pyxpcsviewer.exe "pyxpcsviewer-${{ github.ref_name }}-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/pyxpcsviewer-${{ github.ref_name }}-windows.exe

  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1 libgl1 libopengl0

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .[pyinstaller]

      - name: Build onedir bundle
        run: |
          pyinstaller --noconfirm --windowed --name pyxpcsviewer --collect-all PySide6 --collect-all hdf5plugin src/pyxpcsviewer/cli.py

      - name: Smoke test bundle
        run: |
          ./dist/pyxpcsviewer/pyxpcsviewer --version

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp -r dist/pyxpcsviewer/. AppDir/usr/bin/
          ln -s usr/bin/pyxpcsviewer AppDir/AppRun
          cp src/pyxpcsviewer/gui/view/resources/icons8-giraffe-full-body-100.png AppDir/pyxpcsviewer.png
          cat > AppDir/pyxpcsviewer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=pyXPCSViewer
          Exec=pyxpcsviewer
          Icon=pyxpcsviewer
          Categories=Science;
          Terminal=false
          EOF

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "pyxpcsviewer-${{ github.ref_name }}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: pyxpcsviewer-${{ github.ref_name }}-x86_64.AppImage

  publish-release:
    name: Attach binaries to GitHub Release
    needs: [build-windows-exe, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/*
            artifacts/linux-appimage/*
